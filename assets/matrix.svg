
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07060B"/>
      <stop offset="50%" stop-color="#10091C"/>
      <stop offset="100%" stop-color="#07060B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .rain {
        font: 15px monospace;
        fill: #A78BFA;
        opacity: .7;
        animation: fall 5s linear infinite;
      }
      .r2 { animation-duration: 7s; animation-delay: -3s; }
      .r3 { animation-duration: 4s; animation-delay: -1s; }
      .r4 { animation-duration: 6s; animation-delay: -4s; }
      .r5 { animation-duration: 8s; animation-delay: -2s; }
      @keyframes fall {
        from { transform: translateY(-180px); }
        to { transform: translateY(180px); }
      }
      .pulse { animation: pulse 3s ease-in-out infinite alternate; }
      @keyframes pulse {
        from { opacity: .55; }
        to { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>

  <g stroke="#8B5CF6" stroke-width=".6" opacity=".15">
    <path d="M0 35H1000 M0 70H1000 M0 105H1000 M0 140H1000 M0 175H1000 M0 210H1000 M0 245H1000"/>
    <path d="M50 0V280 M150 0V280 M250 0V280 M350 0V280 M450 0V280 M550 0V280 M650 0V280 M750 0V280 M850 0V280 M950 0V280"/>
  </g>

