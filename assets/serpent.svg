
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" width="100%">
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#080612"/>
      <stop offset="1" stop-color="#10091f"/>
    </linearGradient>
    <linearGradient id="portalColor" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6"/>
      <stop offset=".48" stop-color="#d946ef"/>
      <stop offset=".8" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="portalCore">
      <stop stop-color="#fae8ff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e879f9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#180725" stop-opacity=".98"/>
    </radialGradient>
    <linearGradient id="suit" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#8994b0"/>
    </linearGradient>
    <linearGradient id="skin" x2=".8" y2="1">
      <stop stop-color="#42404d"/>
      <stop offset=".55" stop-color="#191923"/>
      <stop offset="1" stop-color="#05060b"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="180" height="130" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#fff"/>
      <circle cx="75" cy="43" r=".8" fill="#c4b5fd"/>
      <circle cx="130" cy="15" r="1.2" fill="#fff"/>
      <circle cx="158" cy="95" r=".8" fill="#f0abfc"/>
      <circle cx="38" cy="110" r="1" fill="#fff" opacity=".5"/>
      <circle cx="105" cy="83" r=".7" fill="#fff"/>
    </pattern>

    <!-- Único astronauta -->
    <g id="astronaut">
      <rect x="-28" y="-13" width="17" height="36" rx="6"
            fill="#8994b0" stroke="#fff" stroke-width="2"/>
      <rect x="-26" y="-5" width="13" height="9" rx="2" fill="#a855f7"/>
      <path d="M-13 27L-20 43L-11 51L-2 32
               M8 29L17 43L11 51L1 34"
            fill="none" stroke="#dce4f5" stroke-width="10" stroke-linecap="round"/>
      <path d="M-20 45L-10 50L-13 55L-25 53Z
               M10 45L18 42L23 49L13 54Z"
            fill="#fff" stroke="#94a3b8" stroke-width="2"/>
      <path d="M-19-13Q0-21 18-12L22 22Q2 34-19 21Z"
            fill="url(#suit)" stroke="#fff" stroke-width="2"/>
      <rect x="-9" y="-5" width="19" height="16" rx="3"
            fill="#1e293b" stroke="#c4b5fd" stroke-width="1.5"/>
      <circle cx="-3" cy="0" r="2.2" fill="#f472b6"/>
      <circle cx="4" cy="0" r="2.2" fill="#a78bfa"/>
      <path d="M-17-8L-31 3L-26 15
               M17-7L30 1L35-10"
            fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-26" cy="15" r="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="35" cy="-10" r="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
      <circle cy="-25" r="21" fill="url(#suit)" stroke="#fff" stroke-width="2.5"/>
      <path d="M-15-29Q-9-44 7-42Q20-38 17-23Q4-15-12-22Z"
            fill="#11172b" stroke="#a78bfa" stroke-width="2"/>
      <path d="M-10-32Q-3-39 6-36"
            fill="none" stroke="#f0abfc" stroke-width="2"/>
    </g>

    <!-- Alien biomecânico -->
    <g id="monster">
      <!-- Cauda segmentada -->
      <path d="M-43 40C-70 57-82 76-108 81S-150 68-169 91
               L-180 104L-169 101L-177 114L-157 107L-161 119
               L-143 107C-119 91-105 101-84 88L-48 66Z"
            fill="#090b12" stroke="#424252" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-58 54Q-90 80-119 88
               M-76 65L-70 74M-91 73L-85 82
               M-108 81L-102 89M-126 86L-120 94"
            fill="none" stroke="#666577" stroke-width="2"/>

      <!-- Costelas biomecânicas -->
      <path d="M-38 2Q-57 13-51 38Q-47 57-27 67L-20 53Q-36 42-34 25Z"
            fill="#171a24" stroke="#4c4d60" stroke-width="2"/>
      <path d="M-25 8Q-40 24-24 47M-12 2Q-28 22-11 51
               M2 0Q-11 23 3 54M15 4Q5 27 17 51"
            fill="none" stroke="#515264" stroke-width="3" stroke-linecap="round"/>

      <!-- Corpo blindado -->
      <path d="M-38 15Q-51-3-36-23Q-20-40 7-34Q31-29 40-8
               L35 28Q24 51 2 62L-24 54Q-43 40-38 15Z"
            fill="url(#skin)" stroke="#505063" stroke-width="2.5"/>
      <path d="M-31-18L-43-43L-23-32L-16-53L-2-35
               L11-51L18-32L34-39L30-15"
            fill="#151722" stroke="#656477" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Pescoço alongado -->
      <path d="M-19-17Q-28-38-22-55L-13-83Q0-96 14-80
               L23-52Q28-32 17-15Z"
            fill="#10121b" stroke="#57576a" stroke-width="2.5"/>
      <path d="M-14-28L-10-57L-5-76M-2-25L0-54L2-84M11-27L9-54L12-75"
            fill="none" stroke="#48495b" stroke-width="3" stroke-linecap="round"/>

      <!-- Crânio alongado -->
      <path d="M-23-48Q-37-66-30-94Q-25-123 0-139
               Q22-128 30-97Q35-71 19-48L13-28L-13-28Z"
            fill="#171923" stroke="#777488" stroke-width="2.5"/>
      <path d="M-20-94Q-15-119 0-130Q14-116 19-95Q21-76 13-59"
            fill="none" stroke="#a5a1b8" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <path d="M-23-82Q-13-75-18-59M23-82Q13-75 18-59"
            fill="none" stroke="#363747" stroke-width="3"/>

      <!-- Mandíbula e boca dupla -->
      <path d="M-21-47Q0-34 21-47L18-22Q9-9 0-11Q-11-9-18-22Z"
            fill="#08090f" stroke="#777084" stroke-width="2"/>
      <path d="M-17-34Q0-27 17-34L12-17Q0-7-12-17Z"
            fill="#020308" stroke="#a23d78" stroke-width="1.5"/>
      <path d="M-15-32L-11-23L-7-30L-3-21L2-29L7-21L12-30L16-25"
            fill="#e9e7ef" stroke="#a6a2b3" stroke-width="1"/>
      <path d="M-8-14Q-2-8 4-14L1 1L-2 9L-5 0Z"
            fill="#c9c5d5" stroke="#666577" stroke-width="1.5"/>

      <!-- Olhos ocultos brilhando -->
      <path d="M-24-68Q-17-74-11-67M11-67Q17-74 24-68"
            fill="none" stroke="#f472b6" stroke-width="2.5" filter="url(#glow)"/>

      <!-- Braços compridos e garras -->
      <path d="M-32-8Q-48 1-48 20L-63 40L-83 52"
            fill="none" stroke="#171923" stroke-width="12" stroke-linecap="round"/>
      <path d="M-83 52L-98 48L-92 58L-106 66L-88 65L-76 57"
            fill="#090b12" stroke="#696779" stroke-width="2" stroke-linejoin="round"/>
      <path d="M31-6Q48 0 52 19L68 35L82 39"
            fill="none" stroke="#171923" stroke-width="12" stroke-linecap="round"/>
      <path d="M82 39L96 31L91 44L105 49L88 53L76 46"
            fill="#090b12" stroke="#696779" stroke-width="2" stroke-linejoin="round"/>

      <!-- Saliva ácida -->
      <path d="M0 5Q-5 17 0 23Q6 16 0 5Z"
            fill="#d946ef" opacity=".9" filter="url(#glow)"/>
    </g>
  </defs>

  <!-- Fundo espacial -->
  <rect width="1400" height="460" fill="url(#space)"/>
  <rect width="1400" height="460" fill="url(#stars)" opacity=".8"/>
  <g opacity=".18" fill="none" stroke="#a78bfa">
    <ellipse cx="680" cy="230" rx="550" ry="170"/>
    <ellipse cx="680" cy="230" rx="480" ry="130"/>
  </g>
  <circle cx="120" cy="90" r="29" fill="#322050" opacity=".7"/>
  <path d="M91 88Q120 70 148 89" fill="none" stroke="#a78bfa" stroke-width="3" opacity=".45"/>
  <circle cx="830" cy="70" r="13" fill="#4c1d95" opacity=".6"/>

  <!-- Portal original, apenas roxo e rosa -->
  <g id="portal" transform="translate(1130 230)">
    <ellipse rx="112" ry="255" fill="#a855f7" opacity=".08" filter="url(#glow)"/>
    <ellipse rx="91" ry="239" fill="none" stroke="#a855f7" stroke-width="15" opacity=".2" filter="url(#glow)"/>
    <ellipse rx="83" ry="229" fill="#090612" stroke="url(#portalColor)" stroke-width="8" filter="url(#glow)"/>
    <ellipse rx="72" ry="217" fill="none" stroke="#f0abfc" stroke-width="2" opacity=".8"/>
    <ellipse rx="67" ry="211" fill="url(#portalCore)"/>

    <g fill="none" stroke-linecap="round">
      <ellipse rx="53" ry="185" stroke="#f0abfc" stroke-width="5" stroke-dasharray="105 70 45 100">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="43" ry="160" stroke="#c084fc" stroke-width="8" stroke-dasharray="80 65 45 90" opacity=".8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="29" ry="126" stroke="#fb7185" stroke-width="4" stroke-dasharray="55 40 80 70" opacity=".95">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <path d="M-32-180Q15-130-18-83T22 12T-17 110T15 190"
          fill="none" stroke="#f0abfc" stroke-width="5" opacity=".75" filter="url(#glow)">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="M-32-180Q15-130-18-83T22 12T-17 110T15 190;M-22-180Q-15-130 20-83T-15 12T20 110T-10 190;M-32-180Q15-130-18-83T22 12T-17 110T15 190"/>
    </path>
    <g stroke="#f9a8d4" stroke-width="3" fill="none" filter="url(#glow)">
      <path d="M-78-130L-62-115L-71-97L-53-84">
        <animate attributeName="opacity" values=".3;1;.2" dur="1.7s" repeatCount="indefinite"/>
      </path>
      <path d="M77-45L60-29L72-9L56 8">
        <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M-75 80L-59 96L-70 117L-51 130">
        <animate attributeName="opacity" values=".2;1;.3" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M-62-180Q-87-80-67 12" fill="none" stroke="#fff1ff" stroke-width="3" opacity=".65"/>
    <path d="M61 75Q79 145 49 194" fill="none" stroke="#fb7185" stroke-width="4" opacity=".85"/>
  </g>

  <!-- Partículas flutuantes -->
  <g fill="#c4b5fd" opacity=".8">
    <path d="M485 88l5 8-5 8-5-8Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 -15;0 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M730 340l4 6-4 6-4-6Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-8 -18;0 0" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="925" cy="130" r="3">
      <animate attributeName="cy" values="130;105;130" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Alien perseguindo o astronauta -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;780 10;780 10;-180 -8;-180 -8;0 0"
      keyTimes="0;.58;.62;.63;.65;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1"
      keyTimes="0;.56;.61;.65;.66;1" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(130 365) scale(1.08)">
      <use href="#monster"/>
    </g>
  </g>

  <!-- Um único astronauta: flutua, entra no portal e reaparece à esquerda -->
  <g id="loneAstronaut">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;790 -12;790 -12;-120 15;-120 15;0 0"
      keyTimes="0;.58;.62;.63;.65;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1"
      keyTimes="0;.56;.61;.65;.66;1" dur="14s" repeatCount="indefinite"/>

    <!-- Movimento de gravidade zero -->
    <g transform="translate(300 260)">
      <g>
        <use href="#astronaut"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-8 0 0;8 0 0;-5 0 0;-8 0 0"
          dur="3.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" additive="sum" type="translate"
          values="0 0;0 -15;0 7;0 0"
          dur="4.3s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Balão HELP acompanha o astronauta -->
    <g transform="translate(300 150)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0;5 -12;-4 5;0 0"
          dur="3.2s" repeatCount="indefinite"/>
        <path d="M-54-27Q-54-42-39-42H38Q54-42 54-27V2Q54 17 38 17H6L-9 31L-7 17H-39Q-54 17-54 2Z"
          fill="#fff7ff" stroke="#d946ef" stroke-width="2.5" filter="url(#glow)"/>
        <text x="0" y="-9" font-family="monospace" font-size="20"
          font-weight="900" text-anchor="middle" fill="#a21caf">HELP!</text>
        <text x="0" y="8" font-family="monospace" font-size="9"
          text-anchor="middle" fill="#6b21a8">SOS • SOS</text>
      </g>
    </g>
  </g>

  <!-- Ondas de energia -->
  <g fill="none" stroke-linecap="round" opacity=".6">
    <path d="M0 390Q160 365 290 395T590 390" stroke="#8b5cf6" stroke-width="2">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M0 390Q160 365 290 395T590 390;M0 390Q160 410 290 375T590 390;M0 390Q160 365 290 395T590 390"/>
    </path>
    <path d="M650 420Q790 390 900 420T1110 410" stroke="#ec4899" stroke-width="2">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="M650 420Q790 390 900 420T1110 410;M650 420Q790 430 900 400T1110 410;M650 420Q790 390 900 420T1110 410"/>
    </path>
  </g>
</svg>
